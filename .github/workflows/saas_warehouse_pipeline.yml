name: Automated SaaS Revenue & Churn Pipeline

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  run-saas-warehouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build 3-Table Relational SaaS Warehouse
        run: python step1_build_warehouse.py

      - name: Compute MRR & Failed-Payment Churn Alerts
        run: python step2_mrr_churn_analytics.py

      - name: Run Referential & Pricing Quality Gates
        run: python step3_quality_check.py
